name: booking-history

services:
    booking-history-service:
        build:
            context: ../..
            dockerfile: .delivery/configuration/booking-history.dockerfile
        container_name: booking-history-service
        image: task2-booking-history-service
        networks:
            - hotelio-net
        depends_on:
            booking-history-db:
                condition: service_healthy
        environment:
            DATABASE_URL: postgres://booking_history:booking_history@booking-history-db:5432/booking_history
            KAFKA_BROKERS: kafka:9092
            KAFKA_BOOKING_CREATED_TOPIC: booking.created
            KAFKA_BOOKING_HISTORY_GROUP_ID: booking-history-service
    booking-history-db:
        image: postgres:15
        container_name: booking-history-db
        environment:
            POSTGRES_USER: booking_history
            POSTGRES_PASSWORD: booking_history
            POSTGRES_DB: booking_history
        ports:
            - "5434:5432"
        volumes:
            - booking-history-db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U booking_history -d booking_history"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - hotelio-net

networks:
    hotelio-net:
        external: true

volumes:
    booking-history-db-data:
