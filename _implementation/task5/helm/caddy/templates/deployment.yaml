apiVersion: apps/v1

kind: Deployment

metadata:
  name: booking-service-fallback-caddy
  labels:
    app: booking-service-fallback-caddy
    
spec:

  replicas: {{ .Values.replicaCount }}
  
  selector:
    matchLabels:
      app: booking-service-fallback-caddy

  template:
    metadata:
      labels:
        app: booking-service-fallback-caddy
    spec:
      containers:
        - name: caddy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}

          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile

      volumes:
        - name: caddy-config
          configMap:
            name: booking-service-fallback-caddy-config