apiVersion: v1
kind: Service
metadata:
  name: booking-service-fallback-caddy
  labels:
    app: booking-service-fallback-caddy
spec:
  type: ClusterIP
  selector:
    app: booking-service-fallback-caddy
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP