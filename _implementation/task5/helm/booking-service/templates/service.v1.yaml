{{- if eq .Values.version "v1" }}
apiVersion: v1
kind: Service
metadata:
  name: booking-service-v1
  labels:
    app: booking-service
    version: v1
spec:
  type: ClusterIP
  selector:
    app: booking-service
    version: v1
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
{{- end }}