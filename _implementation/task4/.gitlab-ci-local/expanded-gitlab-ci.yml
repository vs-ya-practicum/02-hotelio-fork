stages:
  - .pre
  - build
  - test
  - deploy
  - tag
  - .post
variables:
  IMAGE_TAG: latest
  IMAGE_NAME: booking-service
build:
  stage: build
  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG booking-service
test:
  stage: test
  script:
    - >-
      docker run -d --name booking-service-test -p 8080:8080
      $IMAGE_NAME:$IMAGE_TAG
    - curl --fail http://localhost:8080/ping
    - docker rm -f booking-service-test
deploy:
  stage: deploy
  script:
    - minikube image load $IMAGE_NAME:$IMAGE_TAG
    - >-
      helm upgrade --install booking-service helm/booking-service --values
      helm/booking-service/values.staging.yaml
tag:
  stage: tag
  script:
    - git tag "deploy-$(date +%Y%m%d%H%M%S)"
default: {}
