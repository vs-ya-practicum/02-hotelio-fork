extend schema
    @link(
        url: "https://specs.apollo.dev/federation/v2.3"
        import: ["@external", "@inaccessible", "@key"]
    )

type Booking @key(fields: "id") {
    id: ID!
    userId: String!
    hotelId: String!
    promoCode: String
    discountPercent: Float
    originalDiscountPercent: Float @inaccessible
    hotel: Hotel
}

extend type Hotel @key(fields: "id") {
    id: ID! @external
}

type Query {
    """
    Returns the bookings of the authenticated user.

    Returns UnauthenticatedError when the request has no user identity and
    ForbiddenError when the requester differs from userId.
    """
    bookingsByUser(userId: String!): BookingsByUserResult!
}

union BookingsByUserResult = BookingsByUserSuccess | UnauthenticatedError | ForbiddenError

type BookingsByUserSuccess {
    bookings: [Booking!]!
}

type UnauthenticatedError {
    message: String!
}

type ForbiddenError {
    message: String!
}
