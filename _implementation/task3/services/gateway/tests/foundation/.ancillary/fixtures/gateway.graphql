query GetBookingsWithHotels($userId: String!) {
    bookingsByUser(userId: $userId) {
        id
        hotelId
        hotel {
            id
            name
            city
            stars
        }
        discountPercent
        discountInfo {
            isValid
            originalDiscount
            finalDiscount
            description
            expiresAt
            applicableHotels
        }
    }
}
