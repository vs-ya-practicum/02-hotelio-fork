# docker compose -f tests.compose.yml build --no-cache hotelio-tester
# docker compose -f tests.compose.yml run --rm hotelio-tester

services:
  hotelio-tester:
    build:
      context: .
    image: hotelio-tester
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
      DB_NAME: hotelio
      DB_USER: hotelio
      DB_PASSWORD: hotelio
      BOOKING_DB_HOST: host.docker.internal
      BOOKING_DB_PORT: "5433"
      BOOKING_DB_NAME: booking
      BOOKING_DB_USER: booking
      BOOKING_DB_PASSWORD: booking
      API_URL: http://host.docker.internal:8084
    extra_hosts:
      - "host.docker.internal:host-gateway"
